name: Android app

# Az IsuCode telefonos app (android-app mappa) fordítása. Titkot ez a nyilvános tároló nem tartalmaz:
# az aláírókulcsot a futás a GitHub által aláírt OIDC-tokennel kéri le az isucode.hu-tól (csak ez a munkafolyamat,
# csak a main ágon kapja meg), és a kész APK-t ugyanígy oda tölti fel. Az APK az adminból tölthető le.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-app.yml']

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Aláírókulcs lekérése
        run: |
          tok() { curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=isucode-app" | jq -r .value; }
          T=$(tok); echo "::add-mask::$T"
          curl -sSf --retry 3 -H "X-Oidc-Token: $T" "https://isucode.hu/api/index.php?r=app/build/key" -o "$RUNNER_TEMP/k.json"
          P=$(jq -r .pass "$RUNNER_TEMP/k.json"); echo "::add-mask::$P"
          jq -r .ks "$RUNNER_TEMP/k.json" | base64 -d > "$RUNNER_TEMP/isu.p12"
          rm "$RUNNER_TEMP/k.json"
          echo "KS_PASS=$P" >> "$GITHUB_ENV"
      - name: Fordítás
        working-directory: android-app
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -Pks="$RUNNER_TEMP/isu.p12"
      - name: Feltöltés az isucode.hu-ra
        run: |
          rm -f "$RUNNER_TEMP/isu.p12"
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          T=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=isucode-app" | jq -r .value); echo "::add-mask::$T"
          curl -sSf --retry 3 -H "X-Oidc-Token: $T" -H "Content-Type: application/octet-stream" --data-binary "@$APK" "https://isucode.hu/api/index.php?r=app/build/upload&v=1.0.${{ github.run_number }}"
      - name: Takarítás
        if: always()
        run: rm -f "$RUNNER_TEMP/isu.p12"

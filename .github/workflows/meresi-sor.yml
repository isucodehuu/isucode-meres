name: Mérési sor

# Tartalék út: ha egy ügyfélszerző futás nem tud ide írni, a jelölt-listát az isucode.hu szerverére küldi.
# Ez a munkafolyamat 5 percenként lekéri onnan (csak nyilvános weboldal-címek), beteszi a jeloltek/ mappába,
# és elindítja a „Weboldalak mérése” munkafolyamatot. Nyilvános tároló: a GitHub nem számolja a perceket.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: meresi-sor
  cancel-in-progress: false

jobs:
  pickup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sor lekérése és mérések indítása
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for i in 1 2 3; do curl -sSf --max-time 60 "https://isucode.hu/api/index.php?r=measure/queue" -o q.json && break; sleep 10; done
          [ -s q.json ] || { echo "A szerver nem válaszolt."; exit 0; }
          n=$(python3 -c "import json;print(len(json.load(open('q.json')).get('items',[])))")
          echo "Várakozó listák: $n"
          [ "$n" -gt 0 ] || exit 0
          python3 - <<'PY'
          import json, re
          for it in json.load(open('q.json'))['items']:
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}-[A-Za-z0-9_-]{1,40}', it['name']): continue
              sites = [s for s in it['sites'] if isinstance(s, str) and re.match(r'^https?://\S+$', s)]
              json.dump({'sites': sites}, open(f"jeloltek/{it['name']}.json", 'w'))
              open('names.txt', 'a').write(it['name'] + '\n')
          PY
          git config user.name "ISU"; git config user.email "isuistvanisu@gmail.com"
          git add jeloltek
          git commit -qm "Jelöltek mérésre (sorból: $(tr '\n' ' ' < names.txt))" || true
          for i in 1 2 3 4; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; sleep 5; done
          while read -r name; do
            gh workflow run meres.yml -f file="jeloltek/$name.json"
            echo "Mérés elindítva: $name"
          done < names.txt

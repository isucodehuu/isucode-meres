name: Levélküldés időzítő

# Minden nap reggel 6 és este 10 között (budapesti idő) 10 percenként szól az isucode.hu szerverének: küldje ki az esedékes, az adminban
# már JÓVÁHAGYOTT leveleket. A szerver maga dönti el, mennyi esedékes: 9 és 16 óra között egyenletesen
# elosztja a napi keretet, más időben nem küld semmit, és csak a jóváhagyott leveleket tudja kiküldeni.
# (Az órák UTC-ben vannak.) Közben a szerver a postafiókot is letölti, így egy új válaszról azonnal szól a telefonra.

on:
  schedule:
    - cron: '*/10 5-20 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Esedékes levelek kiküldése
        run: |
          out=$(curl -sS --max-time 120 -w ' [HTTP %{http_code}]' "https://isucode.hu/api/index.php?r=outreach/tick" 2>&1 || true)
          echo "::notice::Válasz: ${out:0:300}"
